name: Repository quality

on:
  pull_request:
  push:
    branches:
      - main
      - staging

jobs:
  repository-quality:
    name: repository-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Fetch native issues
        run: git fetch origin '+refs/issues/*:refs/issues/*'
      - name: Install git-native-issue 1.3.3
        run: |
          git clone --branch v1.3.3 --depth 1 https://github.com/remenoscodes/git-native-issue.git "$RUNNER_TEMP/git-native-issue"
          (cd "$RUNNER_TEMP/git-native-issue" && ./install.sh "$HOME/.local")
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: git issue fsck
